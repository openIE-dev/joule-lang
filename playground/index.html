<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playground - Joule</title>
    <link rel="icon" type="image/svg+xml" href="/joule-lang/favicon.svg">
    <meta name="description" content="Try Joule in your browser — write, compile, run, and analyze energy usage. No installation required.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner">
                <svg class="spinner-svg" viewBox="0 0 24 24">
                    <circle class="spinner-track" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
                    <path class="spinner-fill" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                </svg>
            </div>
            <p class="loading-text" id="loading-status">Loading editor...</p>
        </div>
    </div>

    <section class="playground-section">
        <div class="playground-container">
            <div class="playground-card">
                <!-- Header -->
                <div class="card-header">
                    <div class="header-left">
                        <div class="header-icon-badge">
                            <svg width="20" height="20" viewBox="0 0 28 28" fill="none">
                                <path d="M10 7 L18 7 L16 15 L19 15 L11 23 L13 16 L10 16 Z" fill="currentColor"/>
                            </svg>
                        </div>
                        <div>
                            <h2 class="header-title">Joule Playground</h2>
                            <p class="header-subtitle">WebAssembly Compiler</p>
                        </div>
                    </div>
                    <div class="header-right">
                        <div class="mode-indicator" id="mode-indicator">
                            <span class="mode-dot"></span>
                            WASM
                        </div>
                    </div>
                </div>

                <!-- Example Selector -->
                <div class="example-bar" id="example-bar">
                    <!-- Categories injected by JS -->
                </div>

                <!-- Main Content: 2-column grid -->
                <div class="main-grid">
                    <!-- Code Editor -->
                    <div class="editor-column">
                        <div class="column-toolbar">
                            <span class="toolbar-label">Joule Code</span>
                            <button id="btn-run" class="btn-run" disabled>
                                <svg class="btn-run-icon" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M8 5v14l11-7z"/>
                                </svg>
                                Run
                            </button>
                        </div>
                        <div class="editor-wrapper" id="monaco-container">
                            <div class="editor-loading">
                                <svg class="spinner-svg small" viewBox="0 0 24 24">
                                    <circle class="spinner-track" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
                                    <path class="spinner-fill" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                                </svg>
                                Loading editor...
                            </div>
                        </div>
                    </div>

                    <!-- Divider -->
                    <div class="grid-divider"></div>

                    <!-- Output Panel -->
                    <div class="output-column">
                        <div class="column-toolbar">
                            <span class="toolbar-label">Output</span>
                        </div>
                        <div class="output-content" id="output-content">
                            <div class="output-placeholder">
                                Press <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to run
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <div class="card-footer">
                    <div class="footer-left">
                        <span class="footer-stat footer-stat-energy" id="footer-energy"></span>
                        <span class="footer-stat footer-stat-time" id="footer-time"></span>
                    </div>
                    <div class="footer-right">
                        <span class="footer-note">
                            <span class="footer-accent">*</span> Code compiles and runs via WebAssembly in your browser
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Monaco Editor from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
    <script type="module" src="editor.js"></script>
</body>
</html>
